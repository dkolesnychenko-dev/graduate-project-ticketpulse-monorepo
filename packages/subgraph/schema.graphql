# =================================================================
# TICKETPULSE SUBGRAPH SCHEMA
# NFT-based event ticketing system with FIFO secondary market
# =================================================================

# -----------------------------------------------------------------
# 1. USER (Wallet Owner)
# -----------------------------------------------------------------
type User @entity {
  """
  ID = Wallet address (String/Hex)
  """
  id: ID!

  # --- Analytics (Computed in mapping.ts) ---
  totalEventsCreated: Int!
  totalTicketsBought: Int!
  totalTicketsSold: Int!

  # --- Virtual Relations ---
  eventsCreated: [Event!]! @derivedFrom(field: "organizer")
  ticketsOwned: [Ticket!]! @derivedFrom(field: "currentOwner")
  activityHistory: [ActivityLog!]! @derivedFrom(field: "initiator")

  sellOrders: [SellOrder!]! @derivedFrom(field: "seller")
  buyOrders: [BuyOrder!]! @derivedFrom(field: "buyer")

  # Balances available for withdrawal per event (see Balance entity)
  balances: [Balance!]! @derivedFrom(field: "user")

  createdAt: BigInt!

  updatedAt: BigInt!
}

# -----------------------------------------------------------------
# 2. EVENT (Smart Contract Clone)
# -----------------------------------------------------------------
type Event @entity {
  """
  ID = Event Contract Address (String/Hex)
  Generated via Factory (EIP-1167 Minimal Proxy)
  """
  id: ID!

  organizer: User!
  createdAt: BigInt!
  createdTxHash: Bytes!
  updatedAt: BigInt!
  updatedTxHash: Bytes!

  # --- Lifecycle ---
  # Unix timestamp (UTC). Phase 1 (sale) = createdAt → startTime.
  # Phase 2 (live) = startTime → endTime — all market ops are frozen.
  # Phase 3 (ended) = after endTime — withdrawals unlock for organizer.
  startTime: BigInt!
  endTime: BigInt!

  # --- Ticket Economics ---
  nominalPrice: BigInt! # Primary sale price in Wei
  maxSupply: Int! # Total tickets that can ever be minted (1–10,000,000)
  maxTicketsPerWallet: Int! # Per-wallet purchase cap enforced by the smart contract (not just frontend)
  totalMinted: Int! # Running counter of successfully minted tickets; used to detect soldOut state (totalMinted >= maxSupply)

  # --- Secondary Market Rules ---
  royaltyPercentage: Int! # 0–20%. Share of every resale price that goes to the organizer automatically
  markupPercentage: Int! # 0–100%. Fixed markup over nominalPrice allowed on the secondary market (set by organizer at creation, immutable)
  secondaryMarketPrice: BigInt! # Pre-computed: nominalPrice * (1 + markupPercentage / 100). Stored to avoid recomputing on every query; all sell/buy orders use this exact value

  """
  CID of the JSON metadata file stored on IPFS.
  This is the off-chain source of truth for event details (title, description,
  venue, cover image CID, etc.). The frontend resolves it via IPFS.io / Infura / Pinata.
  gateways with a View Aggregator fallback pattern.
  """
  ipfsMetadataCid: String

  # --- Metadata (IPFS) ---
  # Fields below are indexed from on-chain constructor args so the subgraph
  # can serve basic event cards without an IPFS round-trip.
  # Nullable until the indexer processes the creation transaction.
  title: String
  description: String
  ticketType: String # e.g. "VIP", "General Admission", "Early Bird" — single type per event in v1
  ipfsCoverImageCid: String # IPFS CID of the cover image (min 1200×630 px, max 5 MB)
  ticketSymbol: String # Short NFT collection ticker, 2–10 uppercase chars (e.g. "TNWT26"). Displayed in wallets and block explorers

  # --- Market Statistics ---
  totalPrimaryVolume: BigInt! # Cumulative ETH received from minting (primary sales); locked until endTime
  totalSecondaryVolume: BigInt! # Cumulative ETH volume traded on the secondary market (used in analytics, F-3)
  totalRoyaltiesCollected: BigInt! # Cumulative royalties earned by the organizer across all resales; part of royaltyBalance in Balance entity
  totalResales: Int! # Number of completed ORDER_MATCHED events; displayed in organizer analytics (F-3)

  # --- Queues (FIFO) ---
  # Denormalized counters kept in sync by mapping.ts to avoid counting
  # active orders on every frontend query (performance requirement NFR-PERF-006)
  activeSellOrdersCount: Int! # Tickets currently listed for resale; shown on event detail page (F-23)
  activeBuyOrdersCount: Int! # Buyers currently queued with locked funds; shown on event detail page (F-23)
  sellOrders: [SellOrder!]! @derivedFrom(field: "event")
  buyOrders: [BuyOrder!]! @derivedFrom(field: "event")

  # --- Tickets ---
  tickets: [Ticket!]! @derivedFrom(field: "event")

  # --- Logs ---
  activityLogs: [ActivityLog!]! @derivedFrom(field: "event")
}

# -----------------------------------------------------------------
# 3. TICKET (NFT with Personalization)
# -----------------------------------------------------------------
type Ticket @entity {
  """
  ID = eventAddress + "-" + tokenId
  """
  id: ID!

  tokenId: Int!
  event: Event!

  # --- Ownership ---
  currentOwner: User!
  originalMinter: User! # Who first minted (first buyer on primary market); immutable after mint; used in chain-of-ownership view (F-11)

  # --- Personalization (Privacy-preserving) ---
  """
  Keccak-256 hash of the 65-byte EIP-712 signature that binds a real person
  (first name + last name) to this specific ticket and event contract.
  Computed client-side before the mint transaction: keccak256(signature bytes).
  Stored on-chain in ticketPersonalization[tokenId].
  The actual name is NEVER stored on-chain — only this hash.
  On resale (ORDER_MATCHED) this field is replaced with the new buyer's hash.
  At venue entry, the validator recomputes keccak256(Sig_A from QR code) and
  compares it to this value to prove identity without revealing the name.
  """
  identityHash: Bytes!

  # --- Market State ---
  isOnSale: Boolean! # true when an ACTIVE SellOrder exists for this ticket; toggled by mapping.ts on SELL_ORDER_CREATED / SELL_ORDER_CANCELLED / ORDER_MATCHED
  activeSellOrder: SellOrder # Direct nullable link to the current ACTIVE SellOrder; null when not listed

  # --- Pricing History ---
  mintPrice: BigInt! # Price paid at primary mint (= event.nominalPrice at mint time)
  lastResalePrice: BigInt # Price of the most recent completed resale; null if never resold; shown in chain-of-ownership (F-11)

  # --- Lifecycle ---
  mintedAt: BigInt!
  mintedTxHash: Bytes!
  updatedAt: BigInt!
  updatedTxHash: Bytes!

  # --- Relations ---
  transferHistory: [ActivityLog!]! @derivedFrom(field: "ticket")
}

# -----------------------------------------------------------------
# 4. SELL ORDER (FIFO Queue)
# -----------------------------------------------------------------
type SellOrder @entity {
  """
  ID = createdTxHash + "-" + createdLogIndex
  Uniqueness per action (listing), not per ticket.
  Allows history of multiple listings for the same ticket.
  """
  id: ID!

  event: Event!
  ticket: Ticket!
  seller: User!

  price: BigInt! # Always equal to event.secondaryMarketPrice — fixed by smart contract, no negotiation possible (REQ-3.4-2)

  createdAt: BigInt!
  createdTxHash: Bytes!
  createdLogIndex: Int! # Critical for intra-tx FIFO sorting: when multiple listings land in the same block, log index determines queue position

  # ORDER STATES:
  # ACTIVE    — ticket is queued for sale, waiting for a buyer
  # COMPLETED — atomically matched with a BuyOrder; NFT transferred, funds distributed
  # CANCELLED — seller called dequeue before matching (F-16); ticket returns to "Ready to use"
  status: OrderStatus!

  # Execution details (filled on COMPLETED)
  executedAt: BigInt
  executedTxHash: Bytes
  buyer: User # Address that received the NFT via automatic FIFO match (F-24)
  royaltyPaid: BigInt # Amount sent to organizer's royaltyBalance = price * royaltyPercentage / 100
  sellerReceived: BigInt # Net seller proceeds = price - royaltyPaid; goes to sellerBalance or pushed directly if buyer queue existed (F-14 Scenario A)

  # Cancellation details (filled on CANCELLED)
  cancelledAt: BigInt
  cancelledTxHash: Bytes
}

# -----------------------------------------------------------------
# 5. BUY ORDER (FIFO Queue with Locked Funds)
# -----------------------------------------------------------------
type BuyOrder @entity {
  """
  ID = eventAddress + "-" + orderId
  bidId emitted from contract
  """
  id: ID!

  # orderId is emitted by the contract on BuyOrderCreated event.
  # Used as the FIFO key: lower orderId = earlier in queue = matched first.
  # The contract increments a counter per event, guaranteeing strict ordering
  # even across different blocks.
  orderId: Int!

  event: Event!
  buyer: User!

  # ETH locked by buyer on the smart contract at order creation time.
  # Always equal to event.secondaryMarketPrice.
  # Returned in full on cancellation (F-20); distributed on match (F-24).
  amountLocked: BigInt!

  """
  Keccak-256 hash of EIP-712 signature for the buyer's personal data.
  Generated client-side before the buy order transaction (same flow as primary
  purchase, F-18 Step 2). On ORDER_MATCHED, this hash is written to
  Ticket.identityHash, replacing the previous owner's hash.
  This ensures the new owner can generate a valid QR code (F-9) and pass
  venue validation (F-25) with their own identity.
  """
  identityHash: Bytes!

  createdAt: BigInt!
  createdTxHash: Bytes!

  # ORDER STATES:
  # ACTIVE    — funds locked, waiting for a matching sell order
  # COMPLETED — atomically matched with a SellOrder; ticket transferred to buyer
  # CANCELLED — buyer called cancel (F-20); full refund in the same transaction
  status: OrderStatus!

  # Execution details (filled on COMPLETED)
  executedAt: BigInt
  executedTxHash: Bytes
  matchedTicket: Ticket # The specific NFT received; determined by FIFO from sell queue
  seller: User # Previous owner who listed the ticket

  # Cancellation details (filled on CANCELLED)
  cancelledAt: BigInt
  cancelledTxHash: Bytes
  refundedAmount: BigInt # Always equal to amountLocked; confirmed by CEI pattern in contract
}

# -----------------------------------------------------------------
# 6. BALANCE (Pending Withdrawals)
# -----------------------------------------------------------------
"""
Tracks funds available for withdrawal per user per event.
Separate entity from User to avoid rewriting the entire User record
on every trade (subgraph performance optimization).

Withdrawal rules (enforced by smart contract, REQ-3.7-1):
  - primarySalesBalance and royaltyBalance: organizer can withdraw ONLY after endTime (Phase 3)
  - sellerBalance: available immediately after ORDER_MATCHED (no time lock)

Pull pattern (NFR-SEC-004): no funds are pushed automatically.
Each balance category requires a separate organizer transaction,
or both can be withdrawn together in one tx (F-4.3).
"""
type Balance @entity {
  """
  ID = eventAddress-userAddress
  One balance record per user per event
  """
  id: ID!

  event: Event!
  user: User!

  # Accumulated from all TICKET_MINTED events for this event.
  # Locked until event Phase 3 (currentTime > endTime).
  # Reset to 0 by mapping.ts when ORGANIZER_PRIMARY_WITHDRAWAL is emitted.
  primarySalesBalance: BigInt!

  # Accumulated from royaltyPaid on every ORDER_MATCHED for this event.
  # Locked until event Phase 3 (currentTime > endTime).
  # Reset to 0 by mapping.ts when ORGANIZER_ROYALTY_WITHDRAWAL is emitted.
  royaltyBalance: BigInt!

  # Accumulated from sellerReceived on ORDER_MATCHED when the sell order
  # was placed while a buy queue existed (Scenario B of F-14 / F-22 flow).
  # Note: if a sell order matches instantly (Scenario A in F-14), funds are
  # pushed directly to the seller's wallet in the same tx — sellerBalance stays 0.
  # Reset to 0 by mapping.ts when SELLER_WITHDRAWAL is emitted.
  sellerBalance: BigInt!
}

# -----------------------------------------------------------------
# 7. ACTIVITY LOG (Event History)
# -----------------------------------------------------------------
type ActivityLog @entity {
  """
  ID = txHash-logIndex
  Ensures uniqueness even for batch operations
  """
  id: ID!

  type: ActivityType!
  createdAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  logIndex: Int! # Position of the log within the transaction; used to order events that share a block/tx

  # --- Context ---
  event: Event!
  ticket: Ticket # Null for event-level logs (e.g. EVENT_CREATED, ORGANIZER_PRIMARY_WITHDRAWAL)

  # --- Participants ---
  initiator: User! # msg.sender of the transaction
  from: User # Previous NFT owner on transfer-type logs (TICKET_MINTED, ORDER_MATCHED)
  to: User # New NFT owner on transfer-type logs

  # --- Financial Data ---
  price: BigInt # Total amount paid by buyer (for TICKET_MINTED, ORDER_MATCHED, BUY_ORDER_CREATED)
  royaltyAmount: BigInt # Portion of price that went to organizer (only on ORDER_MATCHED)

  # --- Order References ---
  sellOrder: SellOrder # Linked sell order for sell-side and match events
  buyOrder: BuyOrder # Linked buy order for buy-side and match events
}

# =================================================================
# ENUMS
# =================================================================

enum OrderStatus {
  """
  Waiting in FIFO queue — no counterpart found yet
  """
  ACTIVE

  """
  Atomically matched: NFT transferred, funds distributed (F-24)
  """
  COMPLETED

  """
  Cancelled by user before matching (F-16 for sell, F-20 for buy)
  """
  CANCELLED
}

enum ActivityType {
  # Event lifecycle
  EVENT_CREATED # Organizer deployed a new proxy contract via factory (F-1)

  # Primary market
  TICKET_MINTED # One or more NFTs minted to buyer; one log per mintTickets() call (F-6)

  # Secondary market - Sell side
  SELL_ORDER_CREATED # Ticket added to sell FIFO queue (F-14)
  SELL_ORDER_CANCELLED # Seller removed ticket from queue before matching (F-16)

  # Secondary market - Buy side
  BUY_ORDER_CREATED # Buyer joined buy FIFO queue, funds locked (F-18)
  BUY_ORDER_CANCELLED # Buyer cancelled, full refund in same transaction (F-20)

  # Matching
  """
  Successful atomic FIFO match between the first sell order and first buy order.
  In a single transaction: NFT ownership transfers, identityHash is replaced
  with the buyer's hash, royalty goes to organizer's royaltyBalance,
  remainder goes to seller's sellerBalance (or is pushed directly if buyer
  queue had more entries — F-14 Scenario A optimization).
  """
  ORDER_MATCHED

  # Withdrawals
  """
  Organizer withdrew primarySalesBalance after event endTime (F-4.1).
  Only callable in Phase 3; contract zeroes the balance before transferring (CEI).
  """
  ORGANIZER_PRIMARY_WITHDRAWAL

  """
  Organizer withdrew royaltyBalance after event endTime (F-4.2).
  Combined withdrawal (F-4.3) emits both ORGANIZER_PRIMARY_WITHDRAWAL
  and ORGANIZER_ROYALTY_WITHDRAWAL in the same transaction.
  """
  ORGANIZER_ROYALTY_WITHDRAWAL

  """
  Seller withdrew sellerBalance (F-22).
  Available immediately after ORDER_MATCHED — no endTime lock required.
  """
  SELLER_WITHDRAWAL

  """
  Emitted when matching logic finds the head of a queue has a stale/cancelled
  order and skips it. Does not transfer NFT or funds — purely a housekeeping
  signal so the subgraph can update activeSellOrdersCount / activeBuyOrdersCount
  without waiting for an explicit cancellation event.
  """
  QUEUE_BATCH_CLEANUP
}