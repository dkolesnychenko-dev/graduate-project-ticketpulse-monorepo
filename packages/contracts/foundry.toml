[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["TicketPulseFactory", "TicketPulseEvent"]

[fmt]
ignore = ["src/.deps"]

[rpc_endpoints]
local = "http://localhost:8545"
base_sepolia = "${RPC_URL_BASE_SEPOLIA}"
base = "${RPC_URL_BASE}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
