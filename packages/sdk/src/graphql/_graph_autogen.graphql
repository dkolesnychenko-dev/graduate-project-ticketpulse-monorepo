  title
  ticketType
  ipfsCoverImageCid
  ticketSymbol
  totalPrimaryVolume
  totalSecondaryVolume
  totalRoyaltiesCollected
  totalResales
  activeSellOrdersCount
  activeBuyOrdersCount
}

input Event_filter {
  id: ID
  id_in: [ID!]
  organizer: ID
  organizer_in: [ID!]
  startTime: BigInt
  startTime_gt: BigInt
  startTime_gte: BigInt
  startTime_lt: BigInt
  startTime_lte: BigInt
  endTime: BigInt
  endTime_gt: BigInt
  endTime_gte: BigInt
  endTime_lt: BigInt
  endTime_lte: BigInt
  createdAt: BigInt
  createdAt_gt: BigInt
  createdAt_gte: BigInt
  createdAt_lt: BigInt
  createdAt_lte: BigInt
  totalMinted_gte: Int
  totalMinted_lte: Int
  and: [Event_filter!]
  or: [Event_filter!]
}

