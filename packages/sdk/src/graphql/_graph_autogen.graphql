# ─── Entity types ─────────────────────────────────────────────────────
# These mirror schema.graphql but without @entity / @derivedFrom directives
# (not needed by codegen) and with pagination args on every collection field.

type User {
  id: ID!
  totalEventsCreated: Int!
  totalTicketsBought: Int!
  totalTicketsSold: Int!
  eventsCreated(first: Int, skip: Int, where: Event_filter, orderBy: Event_orderBy, orderDirection: OrderDirection): [Event!]!
  ticketsOwned(first: Int, skip: Int, where: Ticket_filter, orderBy: Ticket_orderBy, orderDirection: OrderDirection): [Ticket!]!
  activityHistory(first: Int, skip: Int, where: ActivityLog_filter, orderBy: ActivityLog_orderBy, orderDirection: OrderDirection): [ActivityLog!]!
  sellOrders(first: Int, skip: Int, where: SellOrder_filter, orderBy: SellOrder_orderBy, orderDirection: OrderDirection): [SellOrder!]!
  buyOrders(first: Int, skip: Int, where: BuyOrder_filter, orderBy: BuyOrder_orderBy, orderDirection: OrderDirection): [BuyOrder!]!
  balances(first: Int, skip: Int, where: Balance_filter, orderBy: Balance_orderBy, orderDirection: OrderDirection): [Balance!]!
  createdAt: BigInt!
  updatedAt: BigInt!
}

type Event {
  id: ID!
  organizer: User!
  createdAt: BigInt!
  createdTxHash: Bytes!
  updatedAt: BigInt!
  updatedTxHash: Bytes!
  startTime: BigInt!
  endTime: BigInt!
  nominalPrice: BigInt!
  maxSupply: Int!
  maxTicketsPerWallet: Int!
  totalMinted: Int!
  royaltyPercentage: Int!
  markupPercentage: Int!
  secondaryMarketPrice: BigInt!
  ipfsMetadataCid: String
  title: String
  ticketType: String
  ipfsCoverImageCid: String
  ticketSymbol: String
  totalPrimaryVolume: BigInt!
  totalSecondaryVolume: BigInt!
  totalRoyaltiesCollected: BigInt!
  totalResales: Int!
  activeSellOrdersCount: Int!
  activeBuyOrdersCount: Int!
  sellOrders(first: Int, skip: Int, where: SellOrder_filter, orderBy: SellOrder_orderBy, orderDirection: OrderDirection): [SellOrder!]!
  buyOrders(first: Int, skip: Int, where: BuyOrder_filter, orderBy: BuyOrder_orderBy, orderDirection: OrderDirection): [BuyOrder!]!
  tickets(first: Int, skip: Int, where: Ticket_filter, orderBy: Ticket_orderBy, orderDirection: OrderDirection): [Ticket!]!
  activityLogs(first: Int, skip: Int, where: ActivityLog_filter, orderBy: ActivityLog_orderBy, orderDirection: OrderDirection): [ActivityLog!]!
}

type Ticket {
  id: ID!
  tokenId: Int!
  event: Event!
  currentOwner: User!
  originalMinter: User!
  identityHash: Bytes!
  isOnSale: Boolean!
  activeSellOrder: SellOrder
  mintPrice: BigInt!
  lastResalePrice: BigInt
  mintedAt: BigInt!
  mintedTxHash: Bytes!
  updatedAt: BigInt!
  updatedTxHash: Bytes!
  transferHistory(first: Int, skip: Int, where: ActivityLog_filter, orderBy: ActivityLog_orderBy, orderDirection: OrderDirection): [ActivityLog!]!
}

type SellOrder {
  id: ID!
  event: Event!
  ticket: Ticket!
  seller: User!
  price: BigInt!
  createdAt: BigInt!
  createdTxHash: Bytes!
  createdLogIndex: Int!
  status: OrderStatus!
  executedAt: BigInt
  executedTxHash: Bytes
  buyer: User
  royaltyPaid: BigInt
  sellerReceived: BigInt
  cancelledAt: BigInt
  cancelledTxHash: Bytes
}

type BuyOrder {
  id: ID!
  orderId: Int!
  event: Event!
  buyer: User!
  amountLocked: BigInt!
  identityHash: Bytes!
  createdAt: BigInt!
  createdTxHash: Bytes!
  status: OrderStatus!
  executedAt: BigInt
  executedTxHash: Bytes
  matchedTicket: Ticket
  seller: User
  cancelledAt: BigInt
  cancelledTxHash: Bytes
  refundedAmount: BigInt
}

type Balance {
  id: ID!
  event: Event!
  user: User!
  primarySalesBalance: BigInt!
  royaltyBalance: BigInt!
  sellerBalance: BigInt!
}

type ActivityLog {
  id: ID!
  type: ActivityType!
  createdAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  logIndex: Int!
  event: Event!
  ticket: Ticket
  initiator: User!
  from: User
  to: User
  price: BigInt
  royaltyAmount: BigInt
  sellOrder: SellOrder
  buyOrder: BuyOrder
}

# ─── Query type ───────────────────────────────────────────────────────
# The Graph generates these root query fields for every @entity type.

type Query {
  event(id: ID!): Event
  events(
    first: Int
    skip: Int
    where: Event_filter
    orderBy: Event_orderBy
    orderDirection: OrderDirection
  ): [Event!]!

  ticket(id: ID!): Ticket
  tickets(
    first: Int
    skip: Int
    where: Ticket_filter
    orderBy: Ticket_orderBy
    orderDirection: OrderDirection
  ): [Ticket!]!

  user(id: ID!): User
  users(
    first: Int
    skip: Int
    where: User_filter
    orderBy: User_orderBy
    orderDirection: OrderDirection
  ): [User!]!

  sellOrder(id: ID!): SellOrder
  sellOrders(
    first: Int
    skip: Int
    where: SellOrder_filter
    orderBy: SellOrder_orderBy
    orderDirection: OrderDirection
  ): [SellOrder!]!

  buyOrder(id: ID!): BuyOrder
  buyOrders(
    first: Int
    skip: Int
    where: BuyOrder_filter
    orderBy: BuyOrder_orderBy
    orderDirection: OrderDirection
  ): [BuyOrder!]!

  balance(id: ID!): Balance
  balances(
    first: Int
    skip: Int
    where: Balance_filter
    orderBy: Balance_orderBy
    orderDirection: OrderDirection
  ): [Balance!]!

  activityLog(id: ID!): ActivityLog
  activityLogs(
    first: Int
    skip: Int
    where: ActivityLog_filter
    orderBy: ActivityLog_orderBy
    orderDirection: OrderDirection
  ): [ActivityLog!]!
}
