# ─────────────────────────────────────────────────────────────────────
# Complete offline schema for graphql-codegen.
#
# The Graph Protocol auto-generates a rich schema from the raw
# schema.graphql at deploy/indexing time.  That generated schema:
#   • adds OrderDirection enum and {Entity}_filter / {Entity}_orderBy types
#   • adds pagination/filter args to every collection and @derivedFrom field
#   • adds a Query type with single-entity and collection queries
#
# graphql-codegen in offline mode can't introspect a live node, so this
# file re-declares the full schema in the form codegen expects.
# schema.graphql is NOT loaded in offline mode — entity types here replace it.
#
# Maintenance rule: when you add / remove a field in schema.graphql, mirror
# the change here.  In CI / production use GRAPHQL_SCHEMA_URL to introspect
# the deployed subgraph for authoritative types.
# ─────────────────────────────────────────────────────────────────────

# ─── Domain enums (mirrored from schema.graphql) ─────────────────────

enum OrderStatus {
  ACTIVE
  COMPLETED
  CANCELLED
}

enum ActivityType {
  EVENT_CREATED
  TICKET_MINTED
  SELL_ORDER_CREATED
  SELL_ORDER_CANCELLED
  BUY_ORDER_CREATED
  BUY_ORDER_CANCELLED
  ORDER_MATCHED
  ORGANIZER_PRIMARY_WITHDRAWAL
  ORGANIZER_ROYALTY_WITHDRAWAL
  SELLER_WITHDRAWAL
  QUEUE_BATCH_CLEANUP
}

# ─── The Graph auto-generated: shared ────────────────────────────────

enum OrderDirection {
  asc
  desc
}

# ─── The Graph auto-generated: Event ─────────────────────────────────

enum Event_orderBy {
  id
  organizer
  createdAt
  updatedAt
  startTime
  endTime
